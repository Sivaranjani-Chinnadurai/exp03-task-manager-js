<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Manager</h1>
        </header>
        
        <main>
            <div class="glass-card add-task-section">
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="What needs to be done?" required>
                    <select id="priority-select">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <button type="submit" class="btn-primary">Add Task</button>
                </form>
            </div>

            <div class="glass-card filters-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="glass-card task-list-section">
                <ul id="task-list">
                    <!-- Tasks will be injected here via JS -->
                </ul>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
